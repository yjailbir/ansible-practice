---
- name: Prepare production
  hosts: production
  tasks:
    - name: Install production tools
      ansible.builtin.import_role:
        name: run_app
        tasks_from: prepare

- name: Build application
  hosts: build
  roles:
    - build_app

- name: Run application
  hosts: production
  tasks:
    - name: Start application
      ansible.builtin.import_role:
        name: run_app
        tasks_from: start
