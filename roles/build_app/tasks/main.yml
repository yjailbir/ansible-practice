---
- name: Install build tools
  become: true
  apt:
    name: [openjdk-17-jdk-headless, git, curl, rsync]
    update_cache: true

- name: Clone project
  git:
    repo: https://github.com/spring-projects/spring-petclinic.git
    dest: /home/ubuntu/petclinic

- name: Build project
  shell: cd /home/ubuntu/petclinic && ./mvnw package -DskipTests && cp target/*.jar app.jar

- name: Copy application to production
  command: rsync -av /home/ubuntu/petclinic/app.jar ubuntu@{{ item }}:/home/ubuntu/app.jar
  loop: "{{ groups['production'] }}"
